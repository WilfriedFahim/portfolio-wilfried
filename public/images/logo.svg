<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Dégradé pour le fond -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"></stop>
      <stop offset="100%" stop-color="#3B82F6"></stop>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00000033"></feDropShadow>
    </filter>
  </defs>

  <!-- Carré arrondi de fond -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="url(#grad)" filter="url(#shadow)"></rect>

  <!-- Monogramme WK -->
  <text x="50%" y="45%" text-anchor="middle" fill="#FFF" font-family="Fira Code, monospace" font-size="28" font-weight="700" dy="0.1em">WK</text>

  <!-- Référence code -->
  <text x="50%" y="70%" text-anchor="middle" fill="#FFF" font-family="Fira Code, monospace" font-size="10" font-weight="500" letter-spacing="1">{"&lt; /&gt;"}</text>
</svg>
